[project]
name = "campaign-ab-testing"
version = "0.1.0"
description = "Analysis of a randomised e-mail campaign: effects, power and uplift."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Lahiru Weerasingha" }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
